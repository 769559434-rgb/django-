<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 清除页面默认外边距，消除浏览器自带空白 */
        
        body {
            margin: 0;
        }
        /* 二级头部整体容器样式 */
        
        .sub-header {
            height: 100px;
            /* 头部固定高度100px */
            background-color: #b8b8b8;
            /* 灰色背景 */
        }
        /* 头部内部高度适配容器，和外层头部等高实现垂直居中基准 */
        
        .sub-header .ht {
            height: 100px;
        }
        /* 内容统一居中容器，限制页面内容最大宽度并水平居中 */
        
        .container {
            width: 1128px;
            /* 标准内容宽度 */
            margin: 0 auto;
            /* 左右auto实现块级元素水平居中 */
        }
        /* 头部Logo区域，左浮动靠左排列 */
        
        .sub-header .logo {
            width: 234px;
            /* Logo固定宽度 */
            float: left;
        }
        /* 导航菜单列表，左浮动，行高等于头部高度实现文字垂直居中，红色边框调试布局 */
        
        .sub-header .menu_list {
            float: left;
            line-height: 100px;
        }
        /* 导航菜单链接样式 */
        
        .sub-header .menu_list a {
            display: inline-block;
            /* 转为行内块，支持上下内边距 */
            padding: 0 10px;
            /* 左右内边距，拉开菜单间距 */
            color: #333;
            /* 文字深灰色 */
            font-size: 16px;
            /* 菜单文字大小 */
            text-decoration: none;
            /* 清除链接默认下划线 */
        }
        
        .sub-header .menu_list a:hover {
            color: #ff6700;
            /* 鼠标悬停变橙色 */
        }
        /* 搜索框区域，右浮动靠右摆放 */
        
        .sub-header .search {
            float: right;
        }
    </style>
</head>


<body>
    <div class="sub-header">
        <div class="container">
            <div class=" ht logo">

                <a href="https://www.mi.com" style="margin-top: 22px; display:inline-block">
                    <img src='./logo-mi2.png' style="width:56px;height: 56px;" alt="小米官网">
                </a>

            </div>

            <div class="ht menu_list">
                <a href="https://www.mi.com/service">xiaomi手机</a>
                <a href="https://www.mi.com/redmi">Redmi红米</a>
                <a href="https://www.mi.com/tv">电视</a>
                <a href="https://www.mi.com/laptop">笔记本</a>
                <a href="https://www.mi.com/appliance">家电</a>
            </div>

            <div class="ht search"></div>
        </div>
    </div>
</body>

</html>
