{% extends "layout.html" %}
{% block title %}添加用户{% endblock %}

{% block content %}
<div class="container">
    <div style="margin-bottom:10px;">
        <a class="btn btn-success" href="/user/add/">
            <span class="glyphicon glyphicon-plus-sign" aria-hidden="true"></span> 新建用户
        </a>
    </div>

    <div class="panel panel-default">
        <div class="panel-heading">
            <span class="glyphicon glyphicon-plus" aria-hidden="true"></span> 添加用户
        </div>
        <div class="panel-body">
            <form method="post" class="form-horizontal" novalidate >
                {% csrf_token %}

                {% for field in form %}
                <div class="form-group">
                    <label class="col-sm-2 control-label">{{ field.label }}</label>
                    <div class="col-sm-6">
                        {{ field }}
                        <span class="text-danger">{{ field.errors.0 }}</span>
                    </div>
                </div>
                {% endfor %}

                <div class="form-group">
                    <div class="col-sm-offset-2 col-sm-6">
                        <button type="submit" class="btn btn-primary">提交</button>
                        <a href="/user/list/" class="btn btn-default" style="margin-left:10px;">返回</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
