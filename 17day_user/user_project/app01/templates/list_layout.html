{% extends "layout.html" %}

{% block content %}
    <!-- 列表页通用骨架：顶部工具条 + 面板表格 -->
    {% block list_header %}{% endblock %}

    <div class="bs-example">
        <div class="panel panel-default">
            <div class="panel-heading">
                <span class="glyphicon glyphicon-list" aria-hidden="true"></span> {% block panel_title %}列表{% endblock %}
            </div>
            {% block table %}{% endblock %}
        </div>
    </div>
{% endblock %}
