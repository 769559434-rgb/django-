{# 员工新建/编辑公共表单模板，被 user_add.html 与 user_edit.html 用 {% include %} 引用 #}
<form method="post" class="form-horizontal">
    {% csrf_token %}

    <div class="form-group">
        <label class="col-sm-2 control-label">姓名</label>
        <div class="col-sm-6">
            <input type="text" class="form-control" placeholder="请输入姓名" name="name" value="{{ obj.name }}" required>
        </div>
    </div>

    <div class="form-group">
        <label class="col-sm-2 control-label">密码</label>
        <div class="col-sm-6">
            <input type="password" class="form-control" placeholder="请输入密码" name="password" value="{{ obj.password }}" required>
        </div>
    </div>

    <div class="form-group">
        <label class="col-sm-2 control-label">年龄</label>
        <div class="col-sm-6">
            <input type="number" class="form-control" placeholder="请输入年龄" name="age" value="{{ obj.age }}" required>
        </div>
    </div>

    <div class="form-group">
        <label class="col-sm-2 control-label">账户余额</label>
        <div class="col-sm-6">
            <input type="number" class="form-control" placeholder="请输入账户余额" name="account" step="0.01" value="{{ obj.account|default:'0' }}">
        </div>
    </div>

    <div class="form-group">
        <label class="col-sm-2 control-label">入职时间</label>
        <div class="col-sm-6">
            <input type="date" class="form-control" name="create_time" value="{{ obj.create_time|date:'Y-m-d' }}" required>
        </div>
    </div>

    <div class="form-group">
        <label class="col-sm-2 control-label">部门</label>
        <div class="col-sm-6">
            <select class="form-control" name="depart" required>
                <option value="">-- 请选择部门 --</option>
                {% for depart in depart_list %}
                <option value="{{ depart.id }}" {% if depart.id == obj.depart_id %}selected{% endif %}>{{ depart.title }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="form-group">
        <label class="col-sm-2 control-label">性别</label>
        <div class="col-sm-6" style="padding-top:7px;">
            <label class="radio-inline">
                <input type="radio" name="gender" value="1" {% if obj.gender == 1 or not obj %}checked{% endif %}> 男
            </label>
            <label class="radio-inline">
                <input type="radio" name="gender" value="2" {% if obj.gender == 2 %}checked{% endif %}> 女
            </label>
        </div>
    </div>

    <div class="form-group">
        <div class="col-sm-offset-2 col-sm-6">
            <button type="submit" class="btn btn-primary">
                <span class="glyphicon glyphicon-ok" aria-hidden="true"></span> 保存
            </button>
            <a href="/user/list/" class="btn btn-default" style="margin-left:10px;">返回</a>
        </div>
    </div>

</form>
