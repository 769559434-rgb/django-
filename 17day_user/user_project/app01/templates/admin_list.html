{% extends "layout.html" %}
{% block title %}管理员管理{% endblock %}
{% block content %}
    <div class="container">
    <!-- 头部按钮+搜索栏 开始 -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <!-- 左侧新建按钮 -->
        <div>
            <a class="btn btn-success" href="/admin/add/">
                <span class="glyphicon glyphicon-plus-sign" aria-hidden="true"></span> 新建管理员
            </a>
        </div>
        <!-- 右侧搜索表单 -->
        <div>
            <form method="get" style="margin:0;">
                <input type="text" name="search" class="form-control" placeholder="输入用户名搜索" value="{{ search_key }}"
                       style="width:300px;display:inline-block;">
                <button class="btn btn-primary">搜索</button>
                <a href="/admin/list/" class="btn btn-default">重置</a>
            </form>
        </div>
    </div>

    <div class="bs-example">
        <div class="panel panel-default">
            <div class="panel-heading">
                <span class="glyphicon glyphicon-list" aria-hidden="true"></span> 管理员列表
            </div>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>用户名</th>
                        <th>密码</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    {% for obj in queryset %}
                    <tr>
                        <td>{{ obj.id }}</td>
                        <td>{{ obj.username }}</td>
                        <td>******</td>
                        <td>
                            <a href="#" class="btn btn-sm btn-warning">编辑</a>
                            <a href="#" onclick="return confirm('确定删除？')" class="btn btn-sm btn-danger">删除</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="text-center">暂无数据</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</div>
{% endblock %}
