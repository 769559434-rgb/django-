{% extends "layout.html" %}
{% block title %}靓号管理{% endblock %} 
{% block content %}
    <div class="container">
    <!-- 头部按钮+搜索栏 开始 -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <!-- 左侧新建按钮 -->
        <div>
            <a class="btn btn-success" href="/pretty/add">
                <span class="glyphicon glyphicon-plus-sign" aria-hidden="true"></span> 新建靓号
            </a>
        </div>
        <!-- 右侧搜索表单 -->
        <div>
            <form method="get" style="margin:0;">
                <input type="text" name="search" class="form-control" placeholder="输入手机号搜索" value="{{ search_key }}"
                       style="width:300px;display:inline-block;">
                <button class="btn btn-primary">搜索</button>
                <a href="/pretty/list/" class="btn btn-default">重置</a>
            </form>
        </div>
    </div>
    <!-- 头部结束，下面原有靓号列表panel完全保留不动 -->

    <div class="bs-example">
        <div class="panel panel-default">
            <div class="panel-heading">
                <span class="glyphicon glyphicon-list" aria-hidden="true"></span> 靓号列表
            </div>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>号码</th>
                        <th>价格</th>
                        <th>级别</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    {% for obj in queryset %}
                    <tr>
                        <th>{{ obj.id }}</th>
                        <td>{{ obj.mobile}}</td>
                        <td>{{ obj.price }}</td>
                        <td>{{ obj.get_level_display }}</td>
                        <td>{{ obj.get_status_display}}</td>
                        <td>
        <a href="{% url 'pretty_edit' obj.id %}" class="btn btn-sm btn-warning">编辑</a>
        <a href="{% url 'pretty_delete' obj.id %}" onclick="return confirm('确定删除？')" class="btn btn-sm btn-danger">删除</a>
</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>



</div>
{% endblock %}
