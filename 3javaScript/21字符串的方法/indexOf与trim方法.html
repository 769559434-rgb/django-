<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //indexOf()方法：返回字符串中指定值首次出现的位置，如果没有找到则返回-1
        var str = "hello world";
        console.log(str.indexOf("l")); // 2
        console.log(str.indexOf("l", 3)); // 3
        console.log(str.indexOf("l", 4)); // 9
        console.log(str.indexOf("l", 10)); // -1
        console.log(str.indexOf("l", -2)); // 9
        console.log(str.indexOf("l", -1)); // 9

        //trim()方法：去除字符串两端的空白字符
        var str2 = "   hello world   ";
        console.log(str2.trim()); // "hello world"
        console.log(str2.trimStart()); // "hello world   "
        console.log(str2.trimEnd()); // "   hello world"    

        //split()方法：将字符串拆分成数组
        var str3 = "apple,banana,orange";
        console.log(str3.split(",")); // ["apple", "banana", "orange"]
        console.log(str3.split(",", 2)); // ["apple", "banana"]
        console.log(str3.split("")); // ["a", "p", "p", "l", "e", ",", "b", "a", "n", "a", "n", "a", ",", "o", "r", "a", "n", "g", "e"]
    </script>
</body>

</html>
