<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //substring()方法：返回字符串的子字符串
        var str = "itbaizhan";
        console.log(str.substring(2, 5)); // 从索引2开始到索引5结束（不包括索引5）
        console.log(str.substring(5)); // 从索引5开始到字符串末尾

        //substr()方法：返回字符串的子字符串
        console.log(str.substr(2, 3)); // 从索引2开始，返回3个字符
        console.log(str.substr(5)); // 从索引5开始到字符串末尾
    </script>
</body>

</html>
