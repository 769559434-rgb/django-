<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        var num1 = 100;
        var num2 = 10;

        //加减乘除
        console.log(num1 + num2);
        console.log(num1 - num2);
        console.log(num1 * num2);
        console.log(num1 / num2);

        //取余
        console.log(num1 % num2);

        //自增和自减
        var num3 = 20
        
        // 前置自增:先加1,再使用
        console.log(++num3); // 21 (先加1变成21,然后输出)
        
        // 前置自减:先减1,再使用
        console.log(--num3); // 20 (先减1变成20,然后输出)
        
        // 后置自增:先使用,再加1
        var num4 = 10;
        console.log(num4++); // 10 (先输出10,然后num4变成11)
        console.log(num4);   // 11 (现在num4已经是11了)
        
        // 后置自减:先使用,再减1
        var num5 = 15;
        console.log(num5--); // 15 (先输出15,然后num5变成14)
        console.log(num5);   // 14 (现在num5已经是14了)
    </script>

</body>

</html>
