{% extends "base.html" %} {% block title %}发布新文章{% endblock %} {% block content %}
<h2>发布新文章</h2>
<hr>
<form method="post">
    <div class="form-group">
        <label>文章标题</label>
        <input type="text" class="form-control" name="title" required>
    </div>
    <div class="form-group">
        <label>作者</label>
        <input type="text" class="form-control" name="author">
    </div>
    <div class="form-group">
        <label>文章内容</label>
        <textarea class="form-control" rows="8" name="content" required></textarea>
    </div>
    <button class="btn btn-success" type="submit">提交发布</button>
</form>
{% endblock %}
