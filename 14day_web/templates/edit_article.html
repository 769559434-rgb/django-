{% extends "base.html" %} {% block title %}编辑文章{% endblock %} {% block content %}
<h2>编辑文章</h2>
<hr>
<form method="post">
    <div class="form-group">
        <label>文章标题</label>
        <input type="text" class="form-control" name="title" value="{{art.title}}" required>
    </div>
    <div class="form-group">
        <label>作者</label>
        <input type="text" class="form-control" name="author" value="{{art.author}}">
    </div>
    <div class="form-group">
        <label>文章内容</label>
        <textarea class="form-control" rows="8" name="content" required>{{art.content}}</textarea>
    </div>
    <button class="btn btn-primary" type="submit">保存修改</button>
    <a href="/article/{{art.id}}" class="btn btn-default">取消</a>
</form>
{% endblock %}
