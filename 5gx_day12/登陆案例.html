<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带验证码登录 - Bootstrap3</title>
    <!-- Bootstrap3 CSS -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css">
    <style>
        .login-box {
            margin-top: 80px;
        }
        
        body {
            background-color: #f5f5f5;
        }
        /* 验证码图片区域 */
        
        .code-img {
            height: 34px;
            line-height: 34px;
            background: #333;
            color: #fff;
            text-align: center;
            letter-spacing: 3px;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-4 col-md-offset-4 login-box">
                <div class="panel panel-default">
                    <div class="panel-heading text-center">
                        <h3 class="panel-title">用户登录</h3>
                    </div>
                    <div class="panel-body">
                        <form id="loginForm">
                            <!-- 用户名 -->
                            <div class="form-group">
                                <label for="username">用户名</label>
                                <input type="text" class="form-control" id="username" placeholder="请输入用户名">
                            </div>
                            <!-- 密码 -->
                            <div class="form-group">
                                <label for="pwd">密码</label>
                                <input type="password" class="form-control" id="pwd" placeholder="请输入密码">
                            </div>
                            <!-- 验证码行：输入框 + 验证码图片 -->
                            <div class="form-group">
                                <label>验证码</label>
                                <div class="row">
                                    <div class="col-xs-7">
                                        <input type="text" class="form-control" id="codeInput" placeholder="请输入验证码">
                                    </div>
                                    <div class="col-xs-5">
                                        <div class="code-img" id="codeImg" title="点击换一张"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="checkbox-inline">
                                <input type="checkbox"> 记住我
                            </label>
                                <a href="#" class="pull-right">忘记密码？</a>
                                <div class="clearfix"></div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-block">登录</button>
                            <hr>
                            <p class="text-center">没有账号？<a href="#">立即注册</a></p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script>
        // 全局保存正确验证码
        let realCode = '';

        // 生成4位随机验证码（数字+大写字母）
        function createCode() {
            let str = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            realCode = '';
            for (let i = 0; i < 4; i++) {
                let idx = Math.floor(Math.random() * str.length);
                realCode += str[idx];
            }
            $('#codeImg').text(realCode);
        }

        // 页面加载生成一次
        createCode();

        // 点击验证码刷新
        $('#codeImg').click(function() {
            createCode();
        });

        // 表单提交校验验证码
        $('#loginForm').submit(function(e) {
            e.preventDefault();
            let inputVal = $('#codeInput').val().toUpperCase();
            if (inputVal !== realCode) {
                alert('验证码输入错误，请重新输入');
                createCode(); // 错误自动刷新验证码
                $('#codeInput').val('');
                return;
            }
            alert('验证码正确，可以提交登录！');
            // 这里可以写AJAX登录请求
        });
    </script>
</body>

</html>
