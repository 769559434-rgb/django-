<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS3栅格</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css">
    <style>
        .row div {
            background: #eee;
            border: 1px solid #fff;
            padding: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h3>BS3 响应式栅格</h3>
        <div class="row">
            <!-- 电脑md分3列，手机xs占满12列 -->
            <div class="col-md-3 col-xs-12 bg-primary text-white">1</div>
            <div class="col-md-3 col-xs-12 bg-success text-white">2</div>
            <div class="col-md-3 col-xs-12 bg-warning">3</div>
            <div class="col-md-3 col-xs-12 bg-danger text-white">4</div>
        </div>
    </div>
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/3.4.1/js/bootstrap.min.js"></script>
</body>

</html>
