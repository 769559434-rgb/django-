<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户信息列表</title>
</head>

<body>
    <h1>用户信息列表</h1>
    <a href="/add_user/">添加用户</a>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>姓名</th>
                <th>密码</th>
                <th>年龄</th>
            </tr>
        </thead>
        <tbody>
            {% for user in data_list %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.password }}</td>
                <td>{{ user.age }}</td>
                <td><a href="/delete_user/{{ user.id }}/">删除</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>

</html>
