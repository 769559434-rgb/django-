<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- 标题与段落 -->
    <h1>一级标题</h1>
    <h2>二级标题</h2>
    <p>这是一个段落。<br>这里是换行。</p>
    <hr>

    <!-- 文本格式化 -->
    <p><b>加粗文本</b>，<strong>强调文本</strong>，<i>斜体文本</i>，
        <em>强调斜体</em>，<u>下划线</u>，<mark>高亮</mark>，<small>小号字</small>，
        <del>删除线</del>，
        <ins>插入线</ins></p>

    <!-- 列表 -->
    <ul>
        <li>无序列表项1</li>
        <li>无序列表项2</li>
    </ul>
    <ol>
        <li>有序列表项1</li>
        <li>有序列表项2</li>
    </ol>
    <dl>
        <dt>术语</dt>
        <dd>术语的解释说明</dd>
    </dl>

    <!-- 超链接与图片 -->
    <a href="https://www.baidu.com/" target="_blank">访问百度</a>
    <br>
    <img src="https://www.baidu.com/img/bd_logo1.png" alt="示例图片">

    <!-- 表格 -->
    <table border="1">
        <tr>
            <th>姓名</th>
            <th>年龄</th>
        </tr>
        <tr>
            <td>张三</td>
            <td>20</td>
        </tr>
    </table>

    <!-- 表单 -->
    <form>
        <label for="name">姓名：</label>
        <input type="text" id="name" name="name">
        <br>
        <label for="message">留言：</label>
        <textarea id="message" name="message"></textarea>
        <br>
        <button type="submit">提交</button>
    </form>

    <!-- 语义化标签 -->
    <header>页眉内容</header>
    <nav>导航栏内容</nav>
    <main>
        <section>
            <article>
                <h2>文章标题</h2>
                <p>文章内容……</p>
            </article>
        </section>
        <aside>侧边栏内容</aside>
    </main>
    <footer>页脚内容</footer>
</body>

</html>
