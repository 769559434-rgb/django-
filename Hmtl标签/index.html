<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #f7f7f7;
        margin: 0;
        padding: 30px;
        color: #222;
    }
    h1, h2 {
        color: #2a7ae2;
        margin-bottom: 10px;
    }
    p {
        line-height: 1.7;
        margin-bottom: 10px;
    }
    hr {
        border: none;
        border-top: 2px solid #e0e0e0;
        margin: 20px 0;
    }
    ul, ol {
        margin-left: 30px;
        margin-bottom: 10px;
    }
    table {
        border-collapse: collapse;
        width: 60%;
        margin: 20px 0;
        background: #fff;
        box-shadow: 0 2px 8px #0001;
    }
    th, td {
        border: 1px solid #bdbdbd;
        padding: 10px 18px;
        text-align: center;
    }
    th {
        background: #e3f0fc;
        color: #1565c0;
        font-weight: bold;
    }
    tr:nth-child(even) td {
        background: #f5faff;
    }
    form {
        background: #fff;
        padding: 18px 24px;
        border-radius: 8px;
        box-shadow: 0 2px 8px #0001;
        width: 350px;
        margin: 20px 0;
    }
    label {
        display: inline-block;
        width: 60px;
        margin-bottom: 8px;
    }
    input, textarea {
        width: 220px;
        padding: 6px;
        margin-bottom: 10px;
        border: 1px solid #bdbdbd;
        border-radius: 4px;
        font-size: 1em;
    }
    button {
        background: #2a7ae2;
        color: #fff;
        border: none;
        padding: 8px 18px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1em;
    }
    button:hover {
        background: #1565c0;
    }
    header, nav, main, aside, footer {
        margin: 10px 0;
        padding: 10px;
        background: #e3f0fc;
        border-radius: 6px;
    }
    header, footer {
        background: #b3e5fc;
        color: #01579b;
        font-weight: bold;
    }
    nav {
        background: #c8e6c9;
        color: #256029;
    }
    aside {
        background: #fff3e0;
        color: #e65100;
    }
</style>
</head>

<body>

</body>

<!-- 标题与段落 -->
<h1>一级标题</h1>
<h2>二级标题</h2>
<p>这是一个段落。<br>这里是换行。</p>
<hr>

<!-- 文本格式化 -->
<p><b>加粗文本</b>，<strong>强调文本</strong>，<i>斜体文本</i>，
    <em>强调斜体</em>，<u>下划线</u>，<mark>高亮</mark>，<small>小号字</small>，
    <del>删除线</del>，
    <ins>插入线</ins></p>

<!-- 列表 -->
<ul>
    <li>无序列表项1</li>
    <li>无序列表项2</li>
</ul>
<ol>
    <li>有序列表项1</li>
    <li>有序列表项2</li>
</ol>
<dl>
    <dt>术语</dt>
    <dd>术语的解释说明</dd>
</dl>

<!-- 表格 -->
<table border="1">
    <tr>
        <th>姓名</th>
        <th>年龄</th>
    </tr>
    <tr>
        <td>张三</td>
        <td>20</td>
    </tr>
</table>

<!-- 表单 -->
<form>
    <label for="name">姓名：</label>
    <input type="text" id="name" name="name">
    <br>
    <label for="message">留言：</label>
    <textarea id="message" name="message"></textarea>
    <br>
    <button type="submit">提交</button>
</form>

<!-- 语义化标签 -->
<header>页眉内容</header>
<nav>导航栏内容</nav>
<main>
    <section>
        <article>
            <h2>文章标题</h2>
            <p>文章内容……</p>
        </article>
    </section>
    <aside>侧边栏内容</aside>
</main>
<footer>页脚内容</footer>

</html>
